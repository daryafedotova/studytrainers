name: Apply divisibility practice options

on:
  push:
    branches:
      - feature/divisibility-detector
    paths:
      - .github/workflows/apply-divisibility-practice-options.yml
      - .github/scripts/patch-divisibility-practice-options.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded patch
        run: node .github/scripts/patch-divisibility-practice-options.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add math/grade-5-6/divisibility-detector/app.js math/grade-5-6/divisibility-detector/styles.css
          git commit -m "feat: add practice setup and math background"
          git push origin HEAD:feature/divisibility-detector
