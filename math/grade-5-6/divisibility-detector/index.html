<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Детектор делимости: признаки делимости, сокращение дробей и НОД для 5–6 классов">
  <title>Детектор делимости</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .library-nav {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 16px 0 0;
    }
    .library-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, .9);
      color: var(--text);
      box-shadow: 0 8px 24px rgba(37, 44, 70, .08);
      text-decoration: none;
      font-weight: 750;
      backdrop-filter: blur(10px);
      transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    }
    .library-link:hover,
    .library-link:focus-visible {
      border-color: #9aa5ff;
      box-shadow: 0 10px 28px rgba(37, 44, 70, .12);
      transform: translateY(-1px);
      outline: none;
    }
    .app-shell { padding-top: 16px; }
    @media (max-width: 720px) {
      .library-nav { width: min(100% - 20px, 680px); padding-top: 10px; }
      .library-link { width: 100%; }
      .app-shell { padding-top: 10px; }
    }
  </style>
</head>
<body>
  <nav class="library-nav" aria-label="Навигация по библиотеке">
    <a class="library-link" href="../../../">← В библиотеку</a>
  </nav>
  <main id="app" class="app-shell" aria-live="polite"></main>
  <script type="module" src="./app.js"></script>
</body>
</html>
