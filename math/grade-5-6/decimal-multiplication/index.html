<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мастер умножения дробей</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
<h1>🚀 Мастер умножения дробей</h1>
<p>Умножение десятичных дробей на 10, 100, 1000 и 0,1; 0,01; 0,001</p>
<input id="name" placeholder="Введите имя">
<div class="rules"><b>Правило:</b><br>При умножении на 10, 100, 1000 запятая переносится вправо.<br>При умножении на 0,1; 0,01; 0,001 — влево.</div>
<button id="start">Начать тренировку</button>
<div id="game" class="hidden">
<h2 id="player"></h2>
<h2 id="score">Баллы: 0</h2>
<h1 id="task"></h1>
<div id="answers"></div>
<p id="hint"></p>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
